<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maittrix — Command Center</title>
<meta name="theme-color" content="#F8F7F4">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Maittrix">
<meta property="og:title" content="Maittrix">
<meta property="og:description" content="AI lead engine for real estate teams — live engagement, nurture, and CRM sync health in one command center.">

<style>
/* ============================================================
   MAITTRIX — design tokens
   Warm stone substrate + iris violet brand + amber signal.
   Chart series/status/ink follow the validated dataviz palette.
   ============================================================ */
:root {
  /* Stone — warm neutral substrate */
  --stone-50:#F8F7F4; --stone-100:#F0EEE9; --stone-150:#E8E6DF;
  --stone-200:#DEDBD2; --stone-300:#C8C4B8; --stone-400:#9E9A8E;
  --stone-500:#726F65; --stone-600:#57544B; --stone-700:#403E37;
  --stone-800:#2A2925; --stone-900:#1B1A17;
  --ink:#191623;

  /* Iris — primary brand */
  --iris-50:#F1EDFF; --iris-100:#E2DAFF; --iris-200:#C6B5FF;
  --iris-300:#A78FFC; --iris-400:#8867F7; --iris-500:#6C4CF1;
  --iris-600:#5433D6; --iris-700:#4126A8; --iris-800:#2F1B7A;
  --iris-900:#1F1250;

  /* Amber — signal accent (sparingly) */
  --amber-400:#F5B027; --amber-500:#E89C0E; --amber-600:#C68106;

  /* Status — reserved, never themed */
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#006300;

  /* Chart series (validated, fixed order) */
  --series-1:#2a78d6; --series-2:#1baf7a; --series-3:#eda100; --series-4:#4a3aa7;
  /* Ordinal ramp (funnel) */
  --ord-1:#86b6ef; --ord-2:#5598e7; --ord-3:#2a78d6; --ord-4:#1c5cab; --ord-5:#0d366b;

  /* Semantic surfaces & ink */
  --page:var(--stone-50);
  --surface:#FFFFFF;
  --surface-2:var(--stone-100);
  --chart-surface:#fcfcfb;
  --fg1:var(--ink);
  --fg2:#514E5C;
  --fg3:#8B889A;
  --border:rgba(25,22,35,0.10);
  --border-strong:rgba(25,22,35,0.16);
  --grid:#e1e0d9;
  --axis:#c3c2b7;
  --spark-dim:#d5d3cb;
  --primary:var(--iris-600);
  --primary-hover:var(--iris-700);
  --primary-bright:var(--iris-500);
  --primary-weak:var(--iris-50);
  --danger-weak:#FBEAEA;
  --grad-signature:linear-gradient(90deg,var(--iris-600) 0%,var(--iris-400) 55%,var(--amber-400) 100%);
  --shadow-card:0 1px 2px rgba(25,22,35,0.05),0 4px 16px rgba(25,22,35,0.05);
  --shadow-pop:0 6px 28px rgba(25,22,35,0.16);
  --font-sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-theme="dark"] {
  --page:#100E17;
  --surface:#191624;
  --surface-2:#211D30;
  --chart-surface:#16161d;
  --fg1:#F2F0F7;
  --fg2:#B9B5C7;
  --fg3:#7E7A8D;
  --border:rgba(255,255,255,0.10);
  --border-strong:rgba(255,255,255,0.17);
  --grid:#2c2c34;
  --axis:#3f3d4a;
  --spark-dim:#4b4958;
  --primary:var(--iris-500);
  --primary-hover:var(--iris-400);
  --primary-bright:var(--iris-300);
  --primary-weak:rgba(108,76,241,0.16);
  --danger-weak:rgba(208,59,59,0.16);
  --good:#0ca30c; --good-text:#2fbe2f;
  --series-1:#3987e5; --series-2:#199e70; --series-3:#c98500; --series-4:#9085e9;
  --ord-1:#86b6ef; --ord-2:#5598e7; --ord-3:#3987e5; --ord-4:#256abf; --ord-5:#184f95;
  --shadow-card:0 1px 2px rgba(0,0,0,0.35),0 4px 18px rgba(0,0,0,0.30);
  --shadow-pop:0 8px 32px rgba(0,0,0,0.55);
}

* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body {
  font-family:var(--font-sans); color:var(--fg1); background:var(--page);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button { font-family:inherit; color:inherit; background:none; border:none; cursor:pointer; }
a { color:var(--primary-bright); text-decoration:none; }
svg { display:block; }
::selection { background:var(--iris-200); color:var(--ink); }

/* ---------- login ---------- */
#login {
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  background:
    radial-gradient(1100px 540px at 50% -12%, rgba(108,76,241,0.18), transparent 62%),
    radial-gradient(700px 420px at 88% 108%, rgba(245,176,39,0.10), transparent 60%),
    var(--page);
}
.login-card {
  width:100%; max-width:396px; background:var(--surface); border:1px solid var(--border);
  border-radius:22px; box-shadow:var(--shadow-card); padding:36px 32px 26px;
}
.brand { display:flex; align-items:center; gap:11px; }
.brand .mark { width:36px; height:36px; border-radius:10px; flex:none; }
.brand .nm { font-weight:800; font-size:21px; letter-spacing:-0.02em; }
.brand .nm sup { font-size:0.5em; color:var(--primary-bright); font-weight:700; margin-left:2px; letter-spacing:0; }
.gradient-rule { height:3px; border-radius:2px; margin:20px 0 24px; background:var(--grad-signature); }
.login-card h1 { font-size:24px; letter-spacing:-0.015em; margin-bottom:4px; }
.login-card .sub { color:var(--fg2); font-size:13.5px; margin-bottom:22px; }
.field-label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
.login-card input {
  width:100%; padding:11px 13px; font-family:inherit; font-size:15px; color:var(--fg1);
  background:var(--surface-2); border:1px solid var(--border-strong); border-radius:10px;
  margin-bottom:16px; transition:border-color .15s, box-shadow .15s;
}
.login-card input:focus { outline:none; border-color:var(--primary-bright); box-shadow:0 0 0 3px var(--primary-weak); }
.btn-primary {
  width:100%; padding:12px; border-radius:10px; background:var(--primary); color:#fff;
  font-size:15px; font-weight:700; transition:background .15s;
}
.btn-primary:hover { background:var(--primary-hover); }
.btn-primary:disabled { opacity:.6; cursor:default; }
.login-err {
  background:var(--danger-weak); color:var(--critical); border:1px solid rgba(208,59,59,0.30);
  border-radius:8px; padding:9px 12px; font-size:13px; margin-bottom:16px; display:none;
}
.login-foot {
  margin-top:22px; text-align:center; color:var(--fg3); font-size:10.5px;
  font-family:var(--font-mono); letter-spacing:.09em; text-transform:uppercase;
}

/* ---------- app shell ---------- */
#app { display:none; min-height:100vh; }
.shell { display:flex; min-height:100vh; }
.side {
  width:236px; flex:none; border-right:1px solid var(--border); background:var(--surface);
  display:flex; flex-direction:column; padding:18px 14px; gap:4px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.side .brand { padding:2px 8px 12px; }
.tenant {
  margin:2px 4px 14px; padding:10px 12px; border:1px solid var(--border); border-radius:12px;
  background:var(--surface-2); display:flex; align-items:center; gap:10px;
}
.tenant .t-logo {
  width:30px; height:30px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center;
  background:var(--ink); color:#fff; font-weight:800; font-size:12px; letter-spacing:.02em;
}
html[data-theme="dark"] .tenant .t-logo { background:var(--iris-600); }
.tenant .t-name { font-size:13px; font-weight:700; line-height:1.2; }
.tenant .t-sub { font-size:11px; color:var(--fg3); }
.side-label {
  padding:10px 10px 6px; font-size:10.5px; font-weight:700; color:var(--fg3);
  text-transform:uppercase; letter-spacing:.09em;
}
.nav-btn {
  display:flex; align-items:center; gap:10px; width:100%; padding:9px 10px; border-radius:10px;
  font-size:13.5px; font-weight:600; color:var(--fg2); text-align:left; transition:background .12s,color .12s;
}
.nav-btn:hover { background:var(--surface-2); color:var(--fg1); }
.nav-btn.active { background:var(--primary-weak); color:var(--primary-bright); }
.nav-btn svg { width:17px; height:17px; flex:none; }
.nav-btn .badge {
  margin-left:auto; font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:99px;
  background:var(--amber-400); color:#3d2b00;
}
.side .spacer { flex:1; }
.user-card { display:flex; align-items:center; gap:10px; padding:10px; border-top:1px solid var(--border); }
.avatar {
  width:32px; height:32px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:#fff; background:var(--iris-500);
}
.user-card .u-name { font-size:13px; font-weight:700; line-height:1.15; }
.user-card .u-role { font-size:11px; color:var(--fg3); }
.icon-btn {
  margin-left:auto; width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  color:var(--fg3); transition:background .12s,color .12s;
}
.icon-btn:hover { background:var(--surface-2); color:var(--fg1); }

.main { flex:1; min-width:0; padding:26px 30px 90px; max-width:1180px; margin:0 auto; }
.topbar { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
.topbar h2 { font-size:21px; letter-spacing:-0.015em; }
.topbar .crumb { color:var(--fg3); font-size:12.5px; font-family:var(--font-mono); }
.topbar .right { margin-left:auto; display:flex; align-items:center; gap:8px; }
.pulse-chip {
  display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--fg2);
  border:1px solid var(--border); background:var(--surface); padding:6px 12px; border-radius:99px;
}
.pulse-dot { width:8px; height:8px; border-radius:50%; background:var(--good); animation:pulse 2.2s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(12,163,12,.45)} 55%{box-shadow:0 0 0 6px rgba(12,163,12,0)} }

/* ---------- cards & grids ---------- */
.card {
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  box-shadow:var(--shadow-card); padding:20px;
}
.card h3 { font-size:14.5px; letter-spacing:-0.01em; display:flex; align-items:center; gap:8px; }
.card .h-sub { color:var(--fg3); font-size:12px; font-weight:500; }
.card-head { display:flex; align-items:baseline; gap:8px; margin-bottom:14px; }
.card-head .right { margin-left:auto; display:flex; align-items:center; gap:6px; }
.grid { display:grid; gap:16px; }
.grid.cols-2 { grid-template-columns:1fr 1fr; }
.grid.cols-3 { grid-template-columns:repeat(3,1fr); }
.grid.cols-4 { grid-template-columns:repeat(4,1fr); }
.grid.main-rail { grid-template-columns:minmax(0,1fr) 340px; align-items:start; }
.stack { display:flex; flex-direction:column; gap:16px; }

/* ---------- hero ---------- */
.hero {
  position:relative; overflow:hidden; border-radius:18px; color:#fff; padding:26px 28px;
  background:
    radial-gradient(700px 320px at 12% -30%, rgba(136,103,247,0.55), transparent 60%),
    radial-gradient(560px 300px at 95% 130%, rgba(245,176,39,0.28), transparent 55%),
    linear-gradient(135deg,#231A4F 0%,var(--iris-800) 48%,#191623 100%);
  border:1px solid rgba(255,255,255,0.08); box-shadow:var(--shadow-card);
}
.hero .eyebrow {
  font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; color:#C9BFF6;
  display:flex; align-items:center; gap:8px; margin-bottom:14px;
}
.hero .eyebrow .prompt { color:var(--amber-400); }
.hero-num { font-size:56px; font-weight:800; letter-spacing:-0.03em; line-height:1; }
.hero-num .unit { font-size:26px; font-weight:700; color:#C9BFF6; margin-left:2px; }
.hero .hero-line { font-size:15.5px; color:#E4DFF8; margin-top:6px; }
.hero .hero-blurb { font-size:13px; color:#B4ABDC; margin-top:12px; max-width:560px; line-height:1.55; }
.hero .hero-blurb strong { color:#fff; font-weight:700; }
.hero-stats { display:flex; gap:26px; margin-top:20px; flex-wrap:wrap; }
.hero-stats .hs { min-width:86px; }
.hero-stats .hs .v { font-size:19px; font-weight:800; letter-spacing:-0.02em; }
.hero-stats .hs .l { font-size:11px; color:#B4ABDC; margin-top:2px; }

/* ---------- stat tiles ---------- */
.tile { padding:16px 18px; }
.tile .t-label { font-size:12px; font-weight:600; color:var(--fg2); }
.tile .t-value { font-size:27px; font-weight:800; letter-spacing:-0.02em; margin-top:6px; }
.tile .t-value .unit { font-size:15px; font-weight:700; color:var(--fg3); }
.tile .t-delta { font-size:12px; font-weight:600; margin-top:4px; color:var(--fg3); }
.tile .t-delta.up { color:var(--good-text); }
.tile .t-delta.down { color:var(--critical); }
.tile .spark { margin-top:10px; }

/* ---------- charts ---------- */
.viz-root { position:relative; }
.chart-frame { position:relative; }
.chart-tip {
  position:fixed; z-index:60; pointer-events:none; display:none; min-width:150px;
  background:var(--surface); border:1px solid var(--border-strong); border-radius:10px;
  box-shadow:var(--shadow-pop); padding:10px 12px; font-size:12px;
}
.chart-tip .tip-title { font-size:11px; color:var(--fg3); font-weight:600; margin-bottom:6px; }
.chart-tip .tip-row { display:flex; align-items:center; gap:8px; margin-top:3px; }
.chart-tip .tip-key { width:14px; height:0; border-top:3px solid; border-radius:2px; flex:none; }
.chart-tip .tip-val { font-weight:800; font-size:13px; }
.chart-tip .tip-name { color:var(--fg2); }
.legend { display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; }
.legend .lg { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--fg2); font-weight:600; }
.legend .key-line { width:16px; height:0; border-top:3px solid; border-radius:2px; }
.legend .key-rect { width:11px; height:11px; border-radius:3px; }
.seg-btns { display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:2px; }
.seg-btns button { font-size:11.5px; font-weight:700; color:var(--fg3); padding:4px 10px; border-radius:7px; }
.seg-btns button.active { background:var(--surface); color:var(--fg1); box-shadow:0 1px 2px rgba(0,0,0,.10); }
.tbl-toggle { font-size:11.5px; font-weight:700; color:var(--fg3); padding:4px 8px; border-radius:7px; border:1px solid var(--border); }
.tbl-toggle:hover { color:var(--fg1); background:var(--surface-2); }
.data-table { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px; }
.data-table th { text-align:left; color:var(--fg3); font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:6px 8px; border-bottom:1px solid var(--border-strong); }
.data-table td { padding:6px 8px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
.data-table td:not(:first-child), .data-table th:not(:first-child) { text-align:right; }

/* horizontal bars */
.hbar-row { display:grid; grid-template-columns:112px 1fr 44px; align-items:center; gap:10px; padding:5px 0; border-radius:8px; }
.hbar-row:hover { background:var(--surface-2); }
.hbar-row .hb-name { font-size:12.5px; font-weight:600; color:var(--fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hbar-row .hb-track { height:16px; position:relative; }
.hbar-row .hb-fill { position:absolute; inset:0 auto 0 0; border-radius:0 4px 4px 0; max-height:16px; }
.hbar-row .hb-val { font-size:12.5px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }

/* flow / funnel */
.flow { display:flex; gap:2px; align-items:flex-end; margin-top:6px; }
.flow .f-step { flex:1; text-align:center; }
.flow .f-bar { border-radius:4px 4px 0 0; margin:0 auto; width:100%; transition:filter .12s; }
.flow .f-step:hover .f-bar { filter:brightness(1.12); }
.flow .f-count { font-size:15px; font-weight:800; margin-top:8px; }
.flow .f-name { font-size:11px; color:var(--fg3); margin-top:1px; }

/* ---------- feed ---------- */
.feed { display:flex; flex-direction:column; }
.feed-item { display:flex; gap:12px; padding:12px 4px; border-bottom:1px solid var(--border); }
.feed-item:last-child { border-bottom:none; }
.feed-ico {
  width:30px; height:30px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); color:var(--fg2);
}
.feed-ico svg { width:15px; height:15px; }
.feed-ico.good { background:rgba(12,163,12,.12); color:var(--good-text); }
.feed-ico.warn { background:rgba(250,178,25,.16); color:#8a6100; }
html[data-theme="dark"] .feed-ico.warn { color:var(--warning); }
.feed-ico.crit { background:var(--danger-weak); color:var(--critical); }
.feed-ico.brand { background:var(--primary-weak); color:var(--primary-bright); }
.feed-body { flex:1; min-width:0; }
.feed-top { display:flex; align-items:baseline; gap:8px; }
.feed-top .f-who { font-size:13px; font-weight:700; }
.feed-top .f-what { font-size:12.5px; color:var(--fg2); }
.feed-top .f-time { margin-left:auto; font-size:11px; color:var(--fg3); white-space:nowrap; }
.feed-msg {
  margin-top:7px; font-size:12.5px; color:var(--fg2); background:var(--surface-2);
  border:1px solid var(--border); border-radius:0 10px 10px 10px; padding:8px 11px; line-height:1.5;
}
.brain-toggle { margin-top:7px; font-size:11.5px; font-weight:700; color:var(--primary-bright); display:inline-flex; align-items:center; gap:5px; }
.brain {
  display:none; margin-top:7px; font-size:12px; color:var(--fg2); line-height:1.55;
  border-left:3px solid var(--iris-300); padding:6px 11px; background:var(--primary-weak); border-radius:0 8px 8px 0;
}
.brain.open { display:block; }
.feed-more { margin:12px auto 0; font-size:12px; font-weight:700; color:var(--fg2); border:1px solid var(--border); border-radius:99px; padding:6px 16px; }
.feed-more:hover { background:var(--surface-2); }

/* ---------- priority queue ---------- */
.pq-item { border:1px solid var(--border); border-radius:13px; padding:13px 14px; margin-bottom:10px; background:var(--surface); }
.pq-item.urgent { border-color:rgba(232,131,90,.5); }
.pq-top { display:flex; align-items:center; gap:10px; }
.pq-top .p-name { font-size:13.5px; font-weight:700; }
.pq-top .p-time { margin-left:auto; font-size:11px; color:var(--fg3); }
.pq-tag { font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:99px; }
.pq-tag.urgent { background:rgba(236,131,90,.15); color:#B04A22; }
html[data-theme="dark"] .pq-tag.urgent { color:var(--serious); }
.pq-msg { font-size:12.5px; color:var(--fg2); margin:8px 0 10px; line-height:1.5; }
.pq-actions { display:flex; gap:8px; }
.btn-sm {
  font-size:12px; font-weight:700; padding:6px 12px; border-radius:8px; border:1px solid var(--border-strong);
  display:inline-flex; align-items:center; gap:6px; transition:background .12s;
}
.btn-sm:hover { background:var(--surface-2); }
.btn-sm.solid { background:var(--primary); border-color:var(--primary); color:#fff; }
.btn-sm.solid:hover { background:var(--primary-hover); }
.all-clear { text-align:center; color:var(--fg2); font-size:13px; padding:26px 10px; }
.all-clear .ac-ico { width:38px; height:38px; margin:0 auto 10px; border-radius:50%; background:rgba(12,163,12,.12); color:var(--good-text); display:flex; align-items:center; justify-content:center; }

/* ---------- inbox ---------- */
.conv-list { display:flex; flex-direction:column; }
.conv {
  display:flex; gap:11px; padding:11px 8px; border-radius:12px; cursor:pointer; border:1px solid transparent;
}
.conv:hover { background:var(--surface-2); }
.conv.active { background:var(--primary-weak); border-color:rgba(108,76,241,.25); }
.conv .c-body { flex:1; min-width:0; }
.conv .c-top { display:flex; align-items:baseline; gap:8px; }
.conv .c-name { font-size:13px; font-weight:700; }
.conv .c-time { margin-left:auto; font-size:11px; color:var(--fg3); white-space:nowrap; }
.conv .c-prev { font-size:12px; color:var(--fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px; }
.conv .c-meta { display:flex; gap:6px; margin-top:5px; align-items:center; }
.chip { font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:99px; background:var(--surface-2); color:var(--fg2); border:1px solid var(--border); }

<script>
'use strict';
/* ============================================================
   Chart engine — SVG, tokens read from CSS custom properties.
   Hover layer: crosshair + one-tooltip-every-series on lines,
   per-mark tooltips on bars. Table view mirrors every chart.
   ============================================================ */
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
const TIP = $('#chartTip');
function showTip(html, x, y) {
  TIP.innerHTML = html;
  TIP.style.display = 'block';
  const r = TIP.getBoundingClientRect();
  let left = x + 14, top = y - r.height - 12;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top < 8) top = y + 16;
  TIP.style.left = left + 'px'; TIP.style.top = top + 'px';
}
function hideTip() { TIP.style.display = 'none'; }
function tipRow(color, name, value) {
  return '<div class="tip-row"><span class="tip-key" style="border-color:' + color + '"></span>' +
    '<span class="tip-val">' + value + '</span> <span class="tip-name">' + escapeHtml(name) + '</span></div>';
}
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

/* --- sparkline (stat tiles) --- */
function sparkline(values, opts) {
  const w = (opts && opts.w) || 120, h = (opts && opts.h) || 26, pad = 2;
  const max = Math.max.apply(null, values), min = Math.min.apply(null, values);
  const span = (max - min) || 1;
  const step = (w - pad * 2) / (values.length - 1);
  const pts = values.map((v, i) => [pad + i * step, h - pad - ((v - min) / span) * (h - pad * 2)]);
  const dim = cssVar('--spark-dim'), acc = cssVar('--series-1');
  const cut = Math.floor(values.length * 0.66);
  const d1 = pts.slice(0, cut + 1).map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const d2 = pts.slice(cut).map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
    '<path d="' + d1 + '" fill="none" stroke="' + dim + '" stroke-width="2" stroke-linecap="round"/>' +
    '<path d="' + d2 + '" fill="none" stroke="' + acc + '" stroke-width="2" stroke-linecap="round"/>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="4" fill="' + acc + '" stroke="' + cssVar('--surface') + '" stroke-width="2"/></svg>';
}

/* --- multi-series line chart with crosshair --- */
function lineChart(host, cfg) {
  // cfg: { labels, series: [{name, values, colorVar}], height }
  host.textContent = '';
  const W = Math.max(320, host.clientWidth || 560), H = cfg.height || 210;
  const padL = 34, padR = 14, padT = 12, padB = 22;
  const iw = W - padL - padR, ih = H - padT - padB;
  const all = cfg.series.flatMap(s => s.values);
  const rawMax = Math.max.apply(null, all);
  const yMax = niceCeil(rawMax);
  const n = cfg.labels.length;
  const x = i => padL + (n === 1 ? iw / 2 : (i * iw / (n - 1)));
  const y = v => padT + ih - (v / yMax) * ih;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', '100%');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.style.display = 'block';

  const gridColor = cssVar('--grid'), axisColor = cssVar('--axis'), muted = cssVar('--fg3');
  // gridlines + y ticks (clean numbers)
  const ticks = 4;
  for (let t = 0; t <= ticks; t++) {
    const v = yMax / ticks * t, yy = y(v);
    const ln = document.createElementNS(NS, 'line');
    ln.setAttribute('x1', padL); ln.setAttribute('x2', W - padR);
    ln.setAttribute('y1', yy); ln.setAttribute('y2', yy);
    ln.setAttribute('stroke', t === 0 ? axisColor : gridColor);
    ln.setAttribute('stroke-width', '1');
    svg.appendChild(ln);
    const tx = document.createElementNS(NS, 'text');
    tx.setAttribute('x', padL - 7); tx.setAttribute('y', yy + 3.5);
    tx.setAttribute('text-anchor', 'end');
    tx.setAttribute('font-size', '10'); tx.setAttribute('fill', muted);
    tx.setAttribute('font-family', 'inherit');
    tx.textContent = fmtNum(v);
    svg.appendChild(tx);
  }
  // x labels (sparse)
  const every = Math.ceil(n / 6);
  for (let i = 0; i < n; i += every) {
    const tx = document.createElementNS(NS, 'text');
    tx.setAttribute('x', x(i)); tx.setAttribute('y', H - 6);
    tx.setAttribute('text-anchor', 'middle');
    tx.setAttribute('font-size', '10'); tx.setAttribute('fill', muted);
    tx.textContent = cfg.labels[i];
    svg.appendChild(tx);
  }
  // series: area wash + 2px line + end dot with surface ring
  const surface = cssVar('--surface');
  cfg.series.forEach(s => {
    const color = cssVar(s.colorVar);
    const pts = s.values.map((v, i) => [x(i), y(v)]);
    const dLine = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = document.createElementNS(NS, 'path');
    area.setAttribute('d', dLine + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (padT + ih) + ' L' + padL + ' ' + (padT + ih) + ' Z');
    area.setAttribute('fill', color); area.setAttribute('opacity', '0.10');
    svg.appendChild(area);
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', dLine);
    path.setAttribute('fill', 'none'); path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '2'); path.setAttribute('stroke-linejoin', 'round'); path.setAttribute('stroke-linecap', 'round');
    svg.appendChild(path);
    const lastP = pts[pts.length - 1];
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('cx', lastP[0]); dot.setAttribute('cy', lastP[1]); dot.setAttribute('r', 4.5);
    dot.setAttribute('fill', color); dot.setAttribute('stroke', surface); dot.setAttribute('stroke-width', '2');
    svg.appendChild(dot);
    // selective direct label: endpoint only
    const lbl = document.createElementNS(NS, 'text');
    lbl.setAttribute('x', lastP[0] - 2); lbl.setAttribute('y', Math.max(padT + 9, lastP[1] - 9));
    lbl.setAttribute('text-anchor', 'end'); lbl.setAttribute('font-size', '10.5'); lbl.setAttribute('font-weight', '700');
    lbl.setAttribute('fill', cssVar('--fg1'));
    lbl.textContent = fmtNum(s.values[s.values.length - 1]);
    svg.appendChild(lbl);
  });
  // crosshair
  const cross = document.createElementNS(NS, 'line');
  cross.setAttribute('y1', padT); cross.setAttribute('y2', padT + ih);
  cross.setAttribute('stroke', axisColor); cross.setAttribute('stroke-width', '1');
  cross.style.display = 'none';
  svg.appendChild(cross);
  const hoverDots = cfg.series.map(s => {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', 4.5); c.setAttribute('fill', cssVar(s.colorVar));
    c.setAttribute('stroke', surface); c.setAttribute('stroke-width', '2');
    c.style.display = 'none'; svg.appendChild(c); return c;
  });
  svg.addEventListener('pointermove', e => {
    const rect = svg.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (W / rect.width);
    let i = Math.round((sx - padL) / (iw / (n - 1)));
    i = Math.max(0, Math.min(n - 1, i));
    cross.style.display = '';
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i));
    let html = '<div class="tip-title">' + escapeHtml(cfg.labels[i]) + '</div>';
    cfg.series.forEach((s, si) => {
      hoverDots[si].style.display = '';
      hoverDots[si].setAttribute('cx', x(i)); hoverDots[si].setAttribute('cy', y(s.values[i]));
      html += tipRow(cssVar(s.colorVar), s.name, fmtNum(s.values[i]));
    });
    showTip(html, e.clientX, e.clientY);
  });
  svg.addEventListener('pointerleave', () => {
    cross.style.display = 'none';
    hoverDots.forEach(d => d.style.display = 'none');
    hideTip();
  });
  host.appendChild(svg);
  // legend (≥2 series)
  if (cfg.series.length >= 2) {
    const lg = el('div', 'legend');
    cfg.series.forEach(s => {
      const item = el('span', 'lg');
      const key = el('span', 'key-line'); key.style.borderColor = cssVar(s.colorVar);
      item.appendChild(key); item.appendChild(document.createTextNode(s.name));
      lg.appendChild(item);
    });
    host.appendChild(lg);
  }
}
function niceCeil(v) {
  const steps = [10,20,40,50,80,100,150,200,300,400,500,800,1000,2000];
  for (const s of steps) if (v <= s) return s;
  return Math.ceil(v / 1000) * 1000;
}
function fmtNum(v) {
  v = Math.round(v);
  return v >= 1000 ? v.toLocaleString('en-US') : String(v);
}

/* --- horizontal bars (direct-labeled) --- */
function hbars(host, rows, cfg) {
  // rows: [{name, value, sub}], cfg: {max, unit, colorVar, tipLabel}
  host.textContent = '';
  const max = cfg.max || Math.max.apply(null, rows.map(r => r.value));
  rows.forEach(r => {
    const row = el('div', 'hbar-row');
    row.setAttribute('tabindex', '0');
    row.appendChild(el('div', 'hb-name', r.name));
    const track = el('div', 'hb-track');
    const fill = el('div', 'hb-fill');
    fill.style.width = Math.max(2, (r.value / max) * 100) + '%';
    fill.style.background = cssVar(cfg.colorVar || '--series-1');
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el('div', 'hb-val', r.value + (cfg.unit || '')));
    const tip = e => {
      let html = '<div class="tip-title">' + escapeHtml(r.name) + (r.sub ? ' · ' + escapeHtml(r.sub) : '') + '</div>' +
        tipRow(cssVar(cfg.colorVar || '--series-1'), cfg.tipLabel || 'Value', r.value + (cfg.unit || ''));
      const rect = row.getBoundingClientRect();
      showTip(html, e.clientX || rect.left + rect.width / 2, e.clientY || rect.top);
    };
    row.addEventListener('pointermove', tip);
    row.addEventListener('focus', tip);
    row.addEventListener('pointerleave', hideTip);
    row.addEventListener('blur', hideTip);
    host.appendChild(row);
  });
}

/* --- flow (ordinal funnel) --- */
function flowChart(host, steps) {
  host.textContent = '';
  const wrap = el('div', 'flow');
  const max = steps[0].count;
  steps.forEach((s, i) => {
    const st = el('div', 'f-step');
    st.setAttribute('tabindex', '0');
    const bar = el('div', 'f-bar');
    bar.style.height = Math.max(10, (s.count / max) * 96) + 'px';
    bar.style.background = cssVar('--ord-' + (i + 1));
    st.appendChild(bar);
    st.appendChild(el('div', 'f-count', s.count.toLocaleString('en-US')));
    st.appendChild(el('div', 'f-name', s.name));
    const pct = Math.round(s.count / max * 100);
    const tip = e => {
      const rect = st.getBoundingClientRect();
      showTip('<div class="tip-title">' + escapeHtml(s.name) + '</div>' +
        tipRow(cssVar('--ord-' + (i + 1)), pct + '% of new leads', s.count.toLocaleString('en-US')),
        e.clientX || rect.left + rect.width / 2, e.clientY || rect.top);
    };
    st.addEventListener('pointermove', tip);
    st.addEventListener('focus', tip);
    st.addEventListener('pointerleave', hideTip);
    st.addEventListener('blur', hideTip);
    wrap.appendChild(st);
  });
  host.appendChild(wrap);
}

/* --- table view (accessibility mirror for any chart) --- */
function dataTable(cols, rows) {
  const t = el('table', 'data-table');
  const thead = el('thead'); const trh = el('tr');
  cols.forEach(c => trh.appendChild(el('th', null, c)));
  thead.appendChild(trh); t.appendChild(thead);
  const tb = el('tbody');
  rows.forEach(r => {
    const tr = el('tr');
    r.forEach(v => tr.appendChild(el('td', null, String(v))));
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  return t;
}
function chartWithTable(host, renderChart, cols, rows) {
  // adds a chart ⇄ table toggle in the host's card header (right slot)
  const frame = el('div', 'chart-frame');
  host.appendChild(frame);
  let showing = 'chart';
  const btn = el('button', 'tbl-toggle');
  btn.appendChild(svgIcon('table', 12));
  btn.appendChild(document.createTextNode(' Table'));
  btn.setAttribute('aria-label', 'Toggle table view');
  const rerender = () => {
    frame.textContent = '';
    if (showing === 'chart') renderChart(frame);
    else frame.appendChild(dataTable(cols, rows));
    btn.childNodes[1].textContent = showing === 'chart' ? ' Table' : ' Chart';
  };
  btn.addEventListener('click', () => { showing = showing === 'chart' ? 'table' : 'chart'; rerender(); });
  rerender();
  return { toggleBtn: btn, rerender };
}
</script>

<script>

/* ============================================================

  { id: 'inbox',     label: 'Live inbox', icon: 'inbox', crumb: 'mtx ▸ frontline', badge: () => NEEDS_YOU.filter(n => n.urgent).length },

  wk.appendChild(cardHead('Workers', '4 healthy · 1 notice'));
  SYNC.workers.forEach(w => {
    const row = el('div', 'sync-row');
    const ic = el('div', 'sync-ico');
    ic.style.background = w.status === 'ok' ? 'rgba(12,163,12,.12)' : 'rgba(250,178,25,.16)';
    ic.style.color = w.status === 'ok' ? 'var(--good-text)' : '#8a6100';
    ic.appendChild(svgIcon(w.status === 'ok' ? 'check' : 'alert', 14));
    row.appendChild(ic);
    const b = el('div');
    b.appendChild(el('div', 's-name', w.name));
    b.appendChild(el('div', 's-desc', w.desc));
    row.appendChild(b);
    const right = el('div', 's-right');
    const p = el('span', 'status-pill ' + (w.status === 'ok' ? 'ok' : 'warn'), w.status === 'ok' ? 'Healthy' : 'Review');
    right.appendChild(p);
    right.appendChild(el('div', 's-desc', w.detail));
    row.appendChild(right);
    wk.appendChild(row);
  });
  grid.appendChild(wk);

  const lg = el('div', 'card');
  lg.appendChild(cardHead('Pipeline log', 'live tail'));
  const pre = el('div', 'mono-log');
  SYNC.log.forEach(l => {
    const line = el('div');
    const t = el('span', 'lg-dim', l.t + '  ');
    line.appendChild(t);
    line.appendChild(el('span', l.level === 'ok' ? 'lg-ok' : 'lg-warn', l.level === 'ok' ? 'OK   ' : 'WARN '));
    line.appendChild(document.createTextNode(l.text));
    pre.appendChild(line);
  });
  lg.appendChild(pre);
  grid.appendChild(lg);
}

  const brand = el('div', 'card');

  [
    ['Team name', 'Team Dunlap Realty'],

  [

    const row = el('div', 'set-row');

    b.appendChild(el('div', 's-title', r[0]));
    b.appendChild(el('div', 's-sub', r[1]));
    row.appendChild(b);
    const tg = el('button', 'toggle' + (r[2] ? ' on' : ''));
    tg.setAttribute('role', 'switch'); tg.setAttribute('aria-checked', String(r[2]));
    tg.addEventListener('click', () => {
      tg.classList.toggle('on');
      tg.setAttribute('aria-checked', tg.classList.contains('on') ? 'true' : 'false');
    });
    row.appendChild(tg);
    voice.appendChild(row);

  // integrations
  const integ = el('div', 'card');
  integ.appendChild(cardHead('Integrations', 'connected systems'));
  [
    ['Sierra Interactive', 'CRM of record · webhook + Direct API · key on file', 'ok', 'Connected'],
    ['Follow Up Boss', 'Auto-login URLs → customSierraSearchURL · tags mirrored', 'ok', 'Connected'],
    ['SendGrid', 'Email sending domain teamdunlaprealty.com', 'ok', 'Connected'],
    ['Twilio', 'SMS · dedicated local number (702)', 'ok', 'Connected']
  ].forEach(r => {
    const row = el('div', 'set-row');
    const b = el('div', 's-body');
    b.appendChild(el('div', 's-title', r[0]));
    b.appendChild(el('div', 's-sub', r[1]));
    row.appendChild(b);
    const p = el('span', 'status-pill ' + r[2]);
    p.appendChild(svgIcon('check', 11)); p.appendChild(document.createTextNode(r[3]));
    row.appendChild(p);
    integ.appendChild(row);

  // team
  const team = el('div', 'card');

    const b = el('div');
    b.appendChild(el('div', 'tm-name', m.name));
    b.appendChild(el('div', 'tm-sub', m.role + ' · ' + m.email));
    row.appendChild(b);
    row.appendChild(el('span', 'chip', m.tag));
    team.appendChild(row);
  });

}

/* ---------- nav & boot ---------- */
const RENDERERS = {
  overview: renderOverview, inbox: renderInbox, nurture: renderNurture,
  analytics: renderAnalytics, sync: renderSync, settings: renderSettings
};
function switchTab(id) {
  activeTab = id;
  const t = TABS.find(x => x.id === id);
  $$('.tab-view').forEach(v => v.classList.remove('active'));
  $('#tab-' + id).classList.add('active');
  $('#tabTitle').textContent = t.label;
  $('#tabCrumb').textContent = t.crumb;
  $$('#sideNav .nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  $$('#mobileNav button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  RENDERERS[id]();
  window.scrollTo({ top: 0 });
}
function renderActiveTab() { RENDERERS[activeTab] && RENDERERS[activeTab](); }
function buildNav() {
  const nav = $('#sideNav'); nav.textContent = '';
  const mnav = $('#mobileNav'); mnav.textContent = '';
  TABS.forEach(t => {
    const b = el('button', 'nav-btn');
    b.dataset.tab = t.id;
    b.appendChild(svgIcon(t.icon, 17));
    b.appendChild(document.createTextNode(t.label));
    if (t.badge) {
      const n = t.badge();
      if (n) b.appendChild(el('span', 'badge', String(n)));
    }
    b.addEventListener('click', () => switchTab(t.id));
    nav.appendChild(b);
    if (t.id !== 'settings') {
      const mb = el('button');
      mb.dataset.tab = t.id;
      mb.appendChild(svgIcon(t.icon, 19));
      mb.appendChild(el('span', null, t.label.split(' ')[0]));
      mb.addEventListener('click', () => switchTab(t.id));
      mnav.appendChild(mb);
    }
  });
}
let booted = false;
function bootApp() {
  if (booted) { switchTab(activeTab); return; }
  booted = true;
  buildNav();
  switchTab('overview');
  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(renderActiveTab, 180);
  });
}
$('#signOut') && $('#signOut').addEventListener('click', () => {
  try { sessionStorage.removeItem('mtx_auth'); } catch (e) {}
  location.reload();
});
$('#signOut') && $('#signOut').appendChild(svgIcon('out', 15));

initTheme();
(function init() {
  let authed = false;
  try { authed = sessionStorage.getItem('mtx_auth') === '1'; } catch (e) {}
  if (authed) showApp();
})();
</script>
