name: Deploy URL populator to Fly
on:
  push:
    branches: [main]
    paths:
      - webhook_handler.py
      - url_populator.py
      - requirements.txt
      - Dockerfile
      - fly.toml
      - .github/workflows/fly_deploy.yml
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create app if it doesn't exist yet
        run: flyctl apps create sierra-fub-sync || true
      - name: Sync Fly secrets from repo secrets
        # Unchanged values make flyctl exit non-zero ("no change detected") — that's fine.
        run: |
          flyctl secrets set --app sierra-fub-sync \
            SIERRA_API_KEY="${{ secrets.SIERRA_API_KEY }}" \
            FUB_API_KEY="${{ secrets.FUB_API_KEY }}" \
            --stage || true
      - name: Deploy
        run: flyctl deploy --remote-only --ha=false
      - name: Confirm machine is running
        run: |
          sleep 10
          flyctl status --app sierra-fub-sync
          flyctl machine list --app sierra-fub-sync | grep -q started
          echo "URL populator is running."
